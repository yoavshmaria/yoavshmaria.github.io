
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>שירון אקורדים</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--sidebar-bg:#141428;--header-bg:#1a1a35;--card-bg:#1e1e38;
  --text:#e8e8f0;--text-muted:#8888aa;--chord:#ffd700;--chord-hover:#ffe566;
  --accent:#4a90d9;--border:#2a2a4a;--active:#2a2a5a;--active-text:#7ab3ff;
  --fs:20px;--sidebar-w:260px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
#header{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--header-bg);border-bottom:1px solid var(--border);
  padding:10px 16px;height:56px;flex-shrink:0;position:relative;z-index:200;
}
#hamburger{
  background:none;border:none;color:var(--text);font-size:24px;
  cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1;
  display:none;
}
#hamburger:hover{background:var(--border)}
#header-title{font-size:18px;font-weight:700;color:var(--active-text);flex:1;text-align:center}
#header-controls{display:flex;gap:8px;align-items:center}
.hdr-btn{
  background:var(--card-bg);border:1px solid var(--border);color:var(--text);
  padding:6px 12px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap;
}
.hdr-btn:hover{background:var(--active)}
#font-size-label{color:var(--text-muted);font-size:13px}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);border-left:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
}
#sidebar-title{
  padding:16px;font-size:14px;font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);
}
#song-list{flex:1;overflow-y:auto;padding:8px 0}
.song-item{
  display:flex;align-items:center;padding:10px 16px;cursor:pointer;
  border-bottom:1px solid transparent;transition:background 0.15s;
  gap:10px;
}
.song-item:hover{background:var(--active)}
.song-item.active{background:var(--active);color:var(--active-text)}
.song-num{color:var(--text-muted);font-size:12px;min-width:20px;text-align:right;flex-shrink:0}
.song-name{font-size:15px;line-height:1.3}

/* MAIN */
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* SONG HEADER */
#song-header{
  background:var(--header-bg);border-bottom:1px solid var(--border);
  padding:14px 20px;position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
#song-title{font-size:22px;font-weight:700;flex:1}
.controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
label.key-label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted)}
#key-select{
  background:var(--card-bg);border:1px solid var(--border);color:var(--chord);
  padding:6px 10px;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;
}
#key-select:focus{outline:none;border-color:var(--accent)}
.font-btn{
  background:var(--card-bg);border:1px solid var(--border);color:var(--text);
  width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:16px;font-weight:700;
}
.font-btn:hover{background:var(--active)}

/* SONG CONTENT */
#song-content{padding:20px 24px;flex:1}
.empty-state{
  display:flex;align-items:center;justify-content:center;height:60vh;
  color:var(--text-muted);font-size:18px;flex-direction:column;gap:16px;
}
.missing-msg{
  background:var(--card-bg);border:1px solid var(--border);border-radius:12px;
  padding:24px;text-align:center;color:var(--text-muted);font-size:16px;max-width:400px;margin:40px auto;
}

/* CHORD DISPLAY */
.song-line{
  display:flex;flex-wrap:wrap;align-items:flex-end;
  margin:6px 0;gap:0;
}
.word-pair{
  display:inline-flex;flex-direction:column;align-items:flex-start;
  padding:0 6px 0 0;
}
.chord-span{
  color:var(--chord);font-weight:700;font-size:0.82em;
  min-height:1.5em;line-height:1.5;white-space:nowrap;
  font-family:'Courier New',monospace;direction:ltr;
  display:block;
}
.chord-span:empty::before{content:'\200B'} /* zero-width space keeps height */
.word-span{
  white-space:nowrap;direction:rtl;line-height:1.6;
  color:var(--text);
}
.word-space{display:inline-block;width:0.3em}
.line-break{width:100%;height:0;border:none;margin:4px 0}
.section-label{
  display:block;color:var(--accent);font-size:0.8em;font-weight:600;
  margin:16px 0 4px;letter-spacing:0.5px;
}

/* MOBILE OVERLAY */
#overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;
}

/* EDIT MODE */
#edit-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.edit-active .chord-span{
  cursor:grab;border-bottom:1px dashed var(--chord);
  min-width:1.2em;border-radius:2px;padding:0 2px;
}
.edit-active .chord-span:active{cursor:grabbing}
.edit-active .word-pair.drag-over>.chord-span{background:var(--active);outline:1px solid var(--chord)}
.chord-edit-input{
  background:transparent;border:none;border-bottom:1px solid var(--chord);
  color:var(--chord);font-family:'Courier New',monospace;
  font-size:0.82em;font-weight:700;width:4.5em;
  direction:ltr;outline:none;padding:0;line-height:1.5;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--sidebar-bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* RESPONSIVE */
@media(max-width:700px){
  #hamburger{display:block}
  #header-title{text-align:right;padding-right:8px}
  #sidebar{
    position:fixed;right:0;top:56px;bottom:0;z-index:160;
    transform:translateX(100%);transition:transform 0.25s ease;
    border-left:1px solid var(--border);
  }
  #sidebar.open{transform:translateX(0)}
  #overlay.open{display:block}
  #main{width:100%}
  #song-content{padding:12px 14px}
  #song-header{padding:10px 14px}
  #song-title{font-size:18px}
}
</style>
</head>
<body>
<div id="header">
  <button id="hamburger" onclick="toggleSidebar()" aria-label="פתח רשימת שירים">☰</button>
  <div id="header-title">שירון אקורדים</div>
  <div id="header-controls">
    <span id="font-size-label">גודל:</span>
    <button class="hdr-btn font-btn" onclick="changeFont(-2)" title="הקטן טקסט">א-</button>
    <button class="hdr-btn font-btn" onclick="changeFont(2)" title="הגדל טקסט">א+</button>
  </div>
</div>
<div id="layout">
  <aside id="sidebar">
    <div id="sidebar-title">רשימת שירים</div>
    <div id="song-list"></div>
  </aside>
  <div id="overlay" onclick="closeSidebar()"></div>
  <main id="main">
    <div id="song-header">
      <div id="song-title">בחר שיר מהרשימה</div>
      <div class="controls-row">
        <label class="key-label">טון:
          <select id="key-select" onchange="onKeyChange()"></select>
        </label>
        <button id="default-key-btn" class="hdr-btn" onclick="setDefaultKey()" title="שמור טון כברירת מחדל לשיר זה">⭐ קבע</button>
        <button id="edit-btn" class="hdr-btn" onclick="toggleEditMode()" title="עריכת אקורדים">עריכה ✏</button>
      </div>
    </div>
    <div id="song-content">
      <div class="empty-state">
        <div>🎵</div>
        <div>בחר שיר מהרשימה בצד</div>
      </div>
    </div>
  </main>
</div>

const KEYS = [
  {label:'C',     idx:0,  flats:false},
  {label:'C#/Db', idx:1,  flats:true},
  {label:'D',     idx:2,  flats:false},
  {label:'D#/Eb', idx:3,  flats:true},
  {label:'E',     idx:4,  flats:false},
  {label:'F',     idx:5,  flats:true},
  {label:'F#/Gb', idx:6,  flats:false},
  {label:'G',     idx:7,  flats:false},
  {label:'G#/Ab', idx:8,  flats:true},
  {label:'A',     idx:9,  flats:false},
  {label:'A#/Bb', idx:10, flats:true},
  {label:'B',     idx:11, flats:false},
];
const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_IDX = {};
['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B','Cb','B#']
  .forEach((n,_)=>{
    const map={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,'B#':0};
    NOTE_IDX[n]=map[n];
  });

function transposeChord(chord, semitones) {
  if (!chord || semitones === 0) return chord;
  // Handle slash chords like C/G
  if (chord.includes('/')) {
    const [top, bass] = chord.split('/');
    return transposeChord(top, semitones) + '/' + transposeChord(bass, semitones);
  }
  const m = chord.match(/^([A-G][#b]?)(.*)/);
  if (!m) return chord;
  const [, root, suffix] = m;
  const idx = NOTE_IDX[root];
  if (idx === undefined) return chord;
  const newIdx = (idx + semitones + 12) % 12;
  // Use flats if the target key uses flats
  const useFlats = KEYS[currentKeyIdx] ? KEYS[currentKeyIdx].flats : false;
  const newRoot = useFlats ? FLAT[newIdx] : SHARP[newIdx];
  return newRoot + suffix;
}

let currentSongId = null;
let currentKeyIdx = 0;  // index into KEYS array (0=C)
let currentFontSize = parseInt(localStorage.getItem('fontSize') || '20');

// ── INDEXEDDB ─────────────────────────────────────────────────
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('shiron_db', 1);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore('song_settings', { keyPath: 'id' });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function initDB() {
  try { db = await openDB(); } catch(e) { console.warn('IndexedDB unavailable', e); }
}

function saveDefaultKey(songId, keyIdx) {
  if (!db) return;
  const tx = db.transaction('song_settings', 'readwrite');
  tx.objectStore('song_settings').put({ id: songId, defaultKey: keyIdx });
}

function loadDefaultKey(songId) {
  return new Promise(resolve => {
    if (!db) { resolve(null); return; }
    const req = db.transaction('song_settings', 'readonly')
                  .objectStore('song_settings').get(songId);
    req.onsuccess = e => resolve(e.target.result ? e.target.result.defaultKey : null);
    req.onerror = () => resolve(null);
  });
}

function setDefaultKey() {
  if (!currentSongId) return;
  saveDefaultKey(currentSongId, currentKeyIdx);
  const btn = document.getElementById('default-key-btn');
  const orig = btn.textContent;
  btn.textContent = '✓ נשמר';
  btn.disabled = true;
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
}

async function init() {
  await initDB();

  // Build song list
  const list = document.getElementById('song-list');
  SONGS.forEach(song => {
    const el = document.createElement('div');
    el.className = 'song-item';
    el.id = 'si-' + song.id;
    el.innerHTML = `<span class="song-num">${song.id}</span><span class="song-name">${song.title}</span>`;
    el.onclick = () => { loadSong(song.id); closeSidebar(); };
    list.appendChild(el);
  });

  // Build key selector
  const sel = document.getElementById('key-select');
  KEYS.forEach((k, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = k.label;
    sel.appendChild(opt);
  });

  // Apply font size
  applyFontSize();

  // Load from hash
  const hash = location.hash.replace('#','');
  if (hash) {
    const id = parseInt(hash);
    if (id) loadSong(id);
  }
}

async function loadSong(id) {
  const song = SONGS.find(s => s.id === id);
  if (!song) return;

  currentSongId = id;

  // Update URL
  location.hash = '#' + id;

  // Highlight in sidebar
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
  const si = document.getElementById('si-' + id);
  if (si) { si.classList.add('active'); si.scrollIntoView({block:'nearest'}); }

  // Set title
  document.getElementById('song-title').textContent = song.title;
  document.getElementById('header-title').textContent = song.title;

  // Use saved default key if available, else song's built-in default
  const savedKey = await loadDefaultKey(id);
  currentKeyIdx = savedKey !== null ? savedKey : song.defaultKey;
  document.getElementById('key-select').value = currentKeyIdx;

  loadChordOverrides(song);
  renderSong(song);
}

function renderSong(song) {
  const content = document.getElementById('song-content');

  if (!song.lines || song.lines.length === 0) {
    content.innerHTML = `<div class="missing-msg">📄 האקורדים לשיר זה עדיין לא הוזנו.<br>ניתן להוסיף אותם ידנית.</div>`;
    return;
  }

  const semitones = (currentKeyIdx - song.tabKey + 12) % 12;
  let html = '';

  song.lines.forEach((line, lineIdx) => {
    html += `<div class="song-line" data-line="${lineIdx}">`;
    const chords = line.map(p => p.chord ? transposeChord(p.chord, semitones) : '');
    const revChords = [...chords].reverse();
    line.forEach((pair, i) => {
      const chord = revChords[i];
      const word = pair.word || '';
      const pairAttrs = editMode
        ? ` data-pair="${i}" data-line="${lineIdx}" ondragover="onChordDragOver(event,this)" ondragleave="onChordDragLeave(this)" ondrop="onChordDrop(event,this)"`
        : '';
      const chordAttrs = editMode
        ? ` data-pair="${i}" data-line="${lineIdx}" draggable="true" ondragstart="onChordDragStart(event,this)" onclick="startChordEdit(this)"`
        : '';
      html += `<span class="word-pair"${pairAttrs}>`;
      html += `<span class="chord-span"${chordAttrs}>${escHtml(chord)}</span>`;
      if (word) {
        html += `<span class="word-span">${escHtml(word)}</span>`;
      }
      html += `</span>`;
    });
    html += '</div>';
  });

  content.innerHTML = html;
  content.classList.toggle('edit-active', editMode);
}

function onKeyChange() {
  currentKeyIdx = parseInt(document.getElementById('key-select').value);
  if (currentSongId) {
    const song = SONGS.find(s => s.id === currentSongId);
    if (song) renderSong(song);
  }
}

function changeFont(delta) {
  currentFontSize = Math.max(14, Math.min(36, currentFontSize + delta));
  localStorage.setItem('fontSize', currentFontSize);
  applyFontSize();
}

function applyFontSize() {
  document.getElementById('main').style.fontSize = currentFontSize + 'px';
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('DOMContentLoaded', init);

// ── EDIT MODE ────────────────────────────────────────────────
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  document.getElementById('edit-btn').classList.toggle('active', editMode);
  if (currentSongId) {
    const song = SONGS.find(s => s.id === currentSongId);
    if (song) renderSong(song);
  }
}

// ── PERSISTENCE ──────────────────────────────────────────────
function loadChordOverrides(song) {
  try {
    const saved = localStorage.getItem('chords_' + song.id);
    if (!saved) return;
    const lineChords = JSON.parse(saved);
    lineChords.forEach((lc, li) => {
      if (!song.lines[li]) return;
      lc.forEach((chord, pi) => {
        if (song.lines[li][pi]) song.lines[li][pi].chord = chord;
      });
    });
  } catch(e) {}
}

function saveChordOverrides(song) {
  const lineChords = song.lines.map(line => line.map(p => p.chord));
  localStorage.setItem('chords_' + song.id, JSON.stringify(lineChords));
}

// ── CLICK TO EDIT ─────────────────────────────────────────────
function startChordEdit(el) {
  if (!editMode) return;
  const song = SONGS.find(s => s.id === currentSongId);
  if (!song) return;
  const pairIdx = parseInt(el.dataset.pair);
  const lineIdx = parseInt(el.dataset.line);
  const line = song.lines[lineIdx];
  const chordDataIdx = line.length - 1 - pairIdx;
  const semitones = (currentKeyIdx - song.tabKey + 12) % 12;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'chord-edit-input';
  input.value = el.textContent.replace('\u200B', '').trim();

  let committed = false;
  const commit = () => {
    if (committed) return;
    committed = true;
    const val = input.value.trim();
    const revSemitones = (12 - semitones) % 12;
    song.lines[lineIdx][chordDataIdx].chord = val ? transposeChord(val, revSemitones) : '';
    saveChordOverrides(song);
    renderSong(song);
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') {
      committed = true;
      input.removeEventListener('blur', commit);
      renderSong(song);
    }
  });

  el.replaceWith(input);
  input.focus();
  input.select();
}

// ── DRAG TO SWAP ──────────────────────────────────────────────
let dragSrc = null;

function onChordDragStart(e, el) {
  const song = SONGS.find(s => s.id === currentSongId);
  if (!song) return;
  const pairIdx = parseInt(el.dataset.pair);
  const lineIdx = parseInt(el.dataset.line);
  dragSrc = { lineIdx, chordDataIdx: song.lines[lineIdx].length - 1 - pairIdx };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', '');
}

function onChordDragOver(e, el) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  el.classList.add('drag-over');
}

function onChordDragLeave(el) {
  el.classList.remove('drag-over');
}

function onChordDrop(e, el) {
  e.preventDefault();
  el.classList.remove('drag-over');
  if (!dragSrc) return;
  const song = SONGS.find(s => s.id === currentSongId);
  if (!song) return;
  const pairIdx = parseInt(el.dataset.pair);
  const lineIdx = parseInt(el.dataset.line);
  if (lineIdx !== dragSrc.lineIdx) { dragSrc = null; return; }
  const tgtDataIdx = song.lines[lineIdx].length - 1 - pairIdx;
  const srcDataIdx = dragSrc.chordDataIdx;
  const tmp = song.lines[lineIdx][srcDataIdx].chord;
  song.lines[lineIdx][srcDataIdx].chord = song.lines[lineIdx][tgtDataIdx].chord;
  song.lines[lineIdx][tgtDataIdx].chord = tmp;
  dragSrc = null;
  saveChordOverrides(song);
  renderSong(song);
}
</script>
